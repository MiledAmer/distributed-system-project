version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: saga-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - saga-net
  order-service:
    build:
      context: .
      dockerfile: docker/order.Dockerfile
    container_name: order-service
    ports:
      - "50051:50051"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - saga-net
  kitchen-service:
    build:
      context: .
      dockerfile: docker/kitchen.Dockerfile
    container_name: kitchen-service
    ports:
      - "50052:50052"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kitchen_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - saga-net
  account-service:
    build:
      context: .
      dockerfile: docker/account.Dockerfile
    container_name: account-service
    ports:
      - "50053:50053"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - saga-net
  orchestrator-service:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    container_name: orchestrator-service
    ports:
      - "8084:8084"
    depends_on:
      - order-service
      - kitchen-service
      - account-service
    networks:
      - saga-net
    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  pgdata:

networks:
  saga-net:
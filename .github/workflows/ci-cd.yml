name: CI/CD - Saga Microservices

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 3. Build & push Order Service
      - name: Build & Push Order Service
        run: |
          docker build -f docker/order.Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/order-service:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/order-service:latest

      # 4. Build & push Kitchen Service
      - name: Build & Push Kitchen Service
        run: |
          docker build -f docker/kitchen.Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/kitchen-service:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/kitchen-service:latest

      # 5. Build & push Account Service
      - name: Build & Push Account Service
        run: |
          docker build -f docker/account.Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/account-service:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/account-service:latest

      # 6. Build & push Orchestrator
      - name: Build & Push Orchestrator
        run: |
          docker build -f docker/orchestrator.Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/orchestrator-service:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/orchestrator-service:latest